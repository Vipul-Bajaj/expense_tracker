name: Flutter Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Firebase configuration
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          # Prefer the current config from secrets; the git-history copies below are stale.
          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          fi
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
          if [ ! -f lib/firebase_options.dart ]; then
            echo "::warning::FIREBASE_OPTIONS_DART_BASE64 not set; using an outdated firebase_options.dart from git history."
            git show 928675fa568ee9cead3b238e6b4da9b2e9e6236a:lib/firebase_options.dart > lib/firebase_options.dart 2>/dev/null || true
          fi
          if [ ! -f android/app/google-services.json ]; then
            git show 9150318cb94ede316c5cdd9f88841072dd55f336:android/app/google-services.json > android/app/google-services.json 2>/dev/null || true
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Display Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run Tests
        run: flutter test
        continue-on-error: true

      - name: Configure release signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$UPLOAD_KEY_PASSWORD
          keyAlias=$UPLOAD_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Upload key secrets not set; building debug-signed artifacts (not uploadable to Google Play)."
            echo "ALLOW_DEBUG_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          fi

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (Google Play)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Prepare APK for distribution
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk expense-tracker.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: expense-tracker.apk

      - name: Publish Direct APK Download & QR Code
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/expense-tracker.apk"
          QR_URL="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${DOWNLOAD_URL}"

          if [ "$TAG_NAME" = "latest" ]; then
            # Clean up prior rolling release to ensure the download link points to the newest build
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest expense-tracker.apk \
              --title "Latest Development Build" \
              --notes "### 📱 Direct Download for Physical Devices
          - 📥 **Direct APK:** [Download expense-tracker.apk](${DOWNLOAD_URL})
          - 🔑 **SHA-1 Fingerprint:** \`4E:41:9E:8A:11:17:3D:B8:C6:FC:A0:8C:40:38:8B:41:D1:50:48:A3\`
          - 🔑 **SHA-256 Fingerprint:** \`BD:69:D1:90:6B:EC:6C:5C:17:F9:E5:5B:77:B4:AB:33:FC:55:73:09:BC:0C:56:53:F1:D3:20:F7:FA:EF:3D:A2\`

          #### Scan with phone camera to download directly:
          <img src=\"${QR_URL}\" width=\"250\" height=\"250\" alt=\"Download QR Code\" />

          ---
          *Built automatically from commit ${{ github.sha }}*" \
              --prerelease
          else
            gh release create "$TAG_NAME" expense-tracker.apk \
              --title "Release $TAG_NAME" \
              --generate-notes
          fi

          # Add direct download link and QR code to GitHub Actions Summary
          echo "## 📱 Direct Build for Physical Device" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **[Download expense-tracker.apk](${DOWNLOAD_URL})**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-1:** \`4E:41:9E:8A:11:17:3D:B8:C6:FC:A0:8C:40:38:8B:41:D1:50:48:A3\`" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA-256:** \`BD:69:D1:90:6B:EC:6C:5C:17:F9:E5:5B:77:B4:AB:33:FC:55:73:09:BC:0C:56:53:F1:D3:20:F7:FA:EF:3D:A2\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scan this QR code with your phone camera to download directly:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<img src=\"${QR_URL}\" width=\"220\" height=\"220\" alt=\"Download QR Code\" />" >> $GITHUB_STEP_SUMMARY